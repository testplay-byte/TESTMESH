name: MeshLabel Build

on:
  push:
    branches: [main]
    # Releases: push a tag like meshlabel-v1.0 to publish a GitHub Release
    # with the APK attached (see the release steps below).
    tags: ['meshlabel-v*']
  workflow_dispatch:

# Release creation needs to write (create release + upload asset).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Repo root hosts multiple apps; this one lives in MESHLABEL/.
    # (Mirrors android-build.yml: same runners, JDK, caching, no
    # setup-android action - see that file's comments for the why.)
    defaults:
      run:
        working-directory: MESHLABEL
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # JVM tests: LabelMe JSON schema round-trip, mask->polygon tracing,
      # YOLO export format - the geometry/format gates before any APK.
      - name: Unit tests (JSON, polygon, YOLO export)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Release is UNSIGNED for this app (no project keystore; debug APK
      # is the installable artifact) - assembleRelease still produces the
      # APK under app-release-unsigned.apk, hence the glob below.
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MESHLABEL-debug
          path: MESHLABEL/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MESHLABEL-release
          path: MESHLABEL/app/build/outputs/apk/release/app-release*.apk

      # ── GitHub Release (only on version tags) ────────────────────────────
      # The release VARIANT of this app is UNSIGNED (no project keystore),
      # so the installable asset is the DEBUG APK (debug-key signed).
      - name: Name release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MESHLABEL.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MESHLABEL ${{ github.ref_name }}
          files: MESHLABEL.apk
          body: |
            MESHLABEL ${{ github.ref_name }} — arm64-v8a only.
            Installable debug-key build (this app ships without a release
            keystore). LabelMe-style annotation + Magic Touch segmentation.
            Built by CI from `${{ github.sha }}`.
