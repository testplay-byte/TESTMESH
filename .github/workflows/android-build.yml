name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No android-actions/setup-android needed: ubuntu-latest runners ship a
      # preinstalled Android SDK with licenses already accepted. That action
      # failed on 'sdkmanager tools' (obsolete package) in run 37401758273.
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMESHVISION-debug
          path: app/build/outputs/apk/debug/app-debug.apk
