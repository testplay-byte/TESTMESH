name: Android Build

on:
  push:
    branches: [main]
    # Releases: push a tag like aimeshvision-v2.1 to publish a GitHub
    # Release with the signed APK attached (see the release steps below).
    tags: ['aimeshvision-v*']
  workflow_dispatch:

# Release creation needs to write (create release + upload asset).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Repo root hosts multiple apps; this workflow builds AIMESHVISION/.
    defaults:
      run:
        working-directory: AIMESHVISION
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No android-actions/setup-android needed: ubuntu-latest runners ship a
      # preinstalled Android SDK with licenses already accepted. That action
      # failed on 'sdkmanager tools' (obsolete package) in run 37401758273.
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Kotlin-native outline verification: MaskGeometryTest asserts the
      # mesh/outline invariants (solidity, corners, straddle, adaptive
      # width, speckles) against the shipped code - the gate that replaces
      # ad-hoc Python image analysis. Fails the build on any regression.
      - name: Unit tests (mesh/outline geometry)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Release variant uses the same committed keystore, so the APK installs
      # as an update over previous installs (stable signing key).
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMESHVISION-debug
          path: AIMESHVISION/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMESHVISION-release
          path: AIMESHVISION/app/build/outputs/apk/release/app-release.apk

      # ── GitHub Release (only on version tags) ────────────────────────────
      # Publishes the SIGNED release APK (project keystore -> installs as
      # an update over previously installed versions) with a clear filename.
      - name: Name release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/AIMESHVISION-release.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AIMESHVISION ${{ github.ref_name }}
          files: AIMESHVISION-release.apk
          body: |
            AIMESHVISION ${{ github.ref_name }} — arm64-v8a only.
            Signed with the project keystore (installs as an update).
            Built by CI from `${{ github.sha }}`.
